    <text x="130" y="526" font-size="30" font-weight="700" fill="#17243c">A clearer path to development</text>
    <g fill="#faf9ff" stroke="#e5e0f5" stroke-width="2">
      <rect x="130" y="563" width="370" height="250" rx="18"/>
      <rect x="535" y="563" width="370" height="250" rx="18"/>
